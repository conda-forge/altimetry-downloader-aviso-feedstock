schema_version: 1

context:
  version: "0.3.2"

package:
  name: altimetry-downloader-aviso
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/altimetry-downloader-aviso/altimetry_downloader_aviso-${{ version }}.tar.gz
  sha256: ba613761e05cbf862b21bd8da302bf416783e6e9704a41e3eff89cb8ea77188e

build:
  noarch: python
  number: 0
  script:
    - python -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools-scm
  run:
    - numpy
    - python >=${{ python_min }}
    - requests
    - typer
    - siphon
    - rich
    - files_collections >=1
    - pyyaml
    - pydantic

tests:
  - python:
      pip_check: true
      imports:
        - altimetry_downloader_aviso
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: "Altimetry Downloader Aviso — Browse and download altimetry data from Aviso"
  license: Apache-2.0
  homepage: https://github.com/robin-cls/aviso
  repository: https://github.com/robin-cls/aviso
  license_file: LICENSE

extra:
  recipe-maintainers:
    - annesophie-cls
    - robin-cls
